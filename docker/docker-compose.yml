version: "3.9"

services:

 server:

  build:

   context: ../server

   dockerfile:
   ../docker/Dockerfile.server

  ports:

   - "5000:5000"

  env_file:

   - ../server/.env

 client:

  build:

   context: ../client

   dockerfile:
   ../docker/Dockerfile.client

  ports:

   - "5173:5173"

 redis:

  image: redis:latest

  ports:

   - "6379:6379"